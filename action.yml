name: 'Orbit Governance Evidence'
description: >
  Collect capped changed files and call hosted Orbit MCP validate_changed_files.
  LLM evaluation and customer control lookup run in Orbit API (not in this Action).
author: 'aahamed-dm'

inputs:
  orbit_governance_key:
    description: 'Orbit governance API key (Bearer). Stored as a repo secret.'
    required: true
  fail_on_required:
    description: 'If true, fail the job when any Required control has passed=false.'
    required: false
    default: 'true'
  source:
    description: 'Evidence source: ci | local'
    required: false
    default: 'ci'

outputs:
  controls_evaluated:
    description: 'Number of controls evaluated in this run.'
    value: ${{ steps.scan.outputs.controls_evaluated }}
  required_failed:
    description: 'Number of Required controls that failed.'
    value: ${{ steps.scan.outputs.required_failed }}
  tier:
    description: 'Tier returned by Orbit validation.'
    value: ${{ steps.scan.outputs.tier }}
  results:
    description: 'JSON array of per-control results (passed + findings).'
    value: ${{ steps.scan.outputs.results }}
  raw_llm_output:
    description: 'Raw LLM JSON from Orbit (same payload saved server-side).'
    value: ${{ steps.scan.outputs.raw_llm_output }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Orbit governance action
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install "${{ github.action_path }}"

    - name: Run Orbit governance evidence scan
      id: scan
      shell: bash
      env:
        INPUT_ORBIT_GOVERNANCE_KEY: ${{ inputs.orbit_governance_key }}
        INPUT_FAIL_ON_REQUIRED: ${{ inputs.fail_on_required }}
        INPUT_SOURCE: ${{ inputs.source }}
      run: python -m orbit_governance_action

branding:
  icon: 'shield'
  color: 'blue'
